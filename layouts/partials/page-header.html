<section class="page-header{{ with .Params.page_header_class }} {{ . }}{{ end }}">

    {{/*  <p class="section-kicker">{{ .Params.kicker | default "Page overview" }}</p>  */}}

      <p class="section-lead">{{ . }}</p>
    {{ end }}
  </div>
</section>
