{{ with site.Params.chatbotApiUrl }}
  <div class="chatbot" data-chatbot data-chatbot-endpoint="{{ . }}">
    <button
      class="chatbot__toggle"
      type="button"
      aria-expanded="false"
      aria-controls="cloudgenesis-assistant-panel"
      data-chatbot-toggle>
      <span class="chatbot__toggle-mark" aria-hidden="true">CG</span>
      <span class="chatbot__toggle-label">Ask CloudGenesis</span>
    </button>

    <section
      class="chatbot__panel"
      id="cloudgenesis-assistant-panel"
      aria-label="CloudGenesis Assistant"
      data-chatbot-panel
      hidden>
      <div class="chatbot__header">
        <div>
          <h2>CloudGenesis Assistant</h2>
          <p>Ask about our healthcare software services</p>
        </div>
        <button class="chatbot__close" type="button" aria-label="Close assistant" data-chatbot-close>
          <span aria-hidden="true">x</span>
        </button>
      </div>

      <div class="chatbot__messages" data-chatbot-messages aria-live="polite" aria-label="Chat messages">
        <p class="chatbot__message chatbot__message--bot">Hello. Ask me about CloudGenesis services, healthcare websites, mobile apps, secure platforms, pricing, or Doc AIde.</p>
      </div>

      <form class="chatbot__form" data-chatbot-form>
        <label class="sr-only" for="cloudgenesis-chatbot-message">Your question</label>
        <input
          id="cloudgenesis-chatbot-message"
          name="message"
          type="text"
          maxlength="500"
          autocomplete="off"
          placeholder="Type your question"
          data-chatbot-input>
        <button class="chatbot__send" type="submit" aria-label="Send">
          <svg aria-hidden="true" viewBox="0 0 24 24" focusable="false">
            <path d="M12 19V5" />
            <path d="m5 12 7-7 7 7" />
          </svg>
        </button>
      </form>
      <p class="chatbot__status" data-chatbot-status role="status" aria-live="polite"></p>
    </section>
  </div>
{{ end }}
