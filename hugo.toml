    dir = ":cacheDir/images"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = false

[params]
  siteName = "CloudGenesis"
  siteDescription = "Secure digital platforms for healthcare professionals, doctors, clinics, and healthcare businesses."
  siteTagline = "Secure digital platforms for modern healthcare practices."
  ogImage = "/images/og-cloudgenesis.png"
  rootCanonical = "/"
  contactApiUrl = "https://cloudgenesis-contact.contactus-8de.workers.dev"
  chatbotApiUrl = "https://cloudgenesis-contact.contactus-8de.workers.dev/chat"
  introVideoYoutubePlaylistId = "PLmtqmcpqDN7BGi4XC6JufC_ww3xjLNYqv"
  turnstileSiteKey = "0x4AAAAAADK3dfKQf0s9_F_d"

